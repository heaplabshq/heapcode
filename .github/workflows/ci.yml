name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Package .vsix
        working-directory: packages/vscode
        run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: heap-code-vsix
          path: packages/vscode/heap-code.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heap-code-vsix

      - uses: softprops/action-gh-release@v2
        with:
          files: heap-code.vsix
          generate_release_notes: true

      # Publishes when the VSCE_PAT secret is configured (a PAT with the
      # Marketplace → Manage scope for the "heapcode" publisher); skipped otherwise.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath heap-code.vsix
