name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Package .vsix
        working-directory: packages/vscode
        run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: cortex-code-vsix
          path: packages/vscode/cortex-code.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cortex-code-vsix

      - uses: softprops/action-gh-release@v2
        with:
          files: cortex-code.vsix
          generate_release_notes: true
