name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup@v4 reads it from package.json's
      # "packageManager" field, and errors out if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Package .vsix
        working-directory: packages/vscode
        run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: heap-code-vsix
          path: packages/vscode/heap-code.vsix

      # Tarball of the exact bundle the build job just built and tested —
      # the release job below publishes this artifact verbatim, never a
      # fresh rebuild, so what gets published is provably what passed CI.
      - name: Package CLI tarball
        working-directory: packages/cli
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: heapcode-cli-tarball
          path: packages/cli/*.tgz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heap-code-vsix

      - uses: actions/download-artifact@v4
        with:
          name: heapcode-cli-tarball

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            heap-code.vsix
            *.tgz
          generate_release_notes: true

      # Publishes when the VSCE_PAT secret is configured (a PAT with the
      # Marketplace → Manage scope for the "heapcode" publisher); skipped otherwise.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath heap-code.vsix

      - uses: actions/setup-node@v4
        if: ${{ env.NPM_TOKEN != '' }}
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Publishes when the NPM_TOKEN secret is configured (an npm automation
      # token with publish rights for the @heapcode org); skipped otherwise.
      # publishConfig.access in packages/cli/package.json (bundled inside the
      # tarball) is what makes this a public publish of a scoped package —
      # no --access flag needed here.
      - name: Publish @heapcode/cli to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
