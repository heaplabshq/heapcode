name: Deploy sites

# The marketing site is a Worker serving static assets, and until now it was
# only ever deployed by someone running `wrangler deploy` by hand. That held up
# fine while the same person wrote and shipped each change, and broke the first
# time those were different people: the site sat on a stale version for a day
# after the change had already merged.
#
# Deliberately its own workflow rather than a job in ci.yml — the site is plain
# HTML with no relationship to the packages' build or tests, so gating it on
# them would only make it slower and couple two unrelated things. `paths` keeps
# it from firing on the many commits that never touch website/.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-browse/**'
      - '.github/workflows/deploy-site.yml'
  # Lets a stale site be redeployed without an empty commit.
  workflow_dispatch:

# Two products, two domains, two assets-only Workers. A matrix rather than two
# jobs: they differ only by directory, and a copy-pasted job is where the second
# one quietly stops matching the first.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Neither site should be held back because the other failed to deploy.
      fail-fast: false
      matrix:
        site: [website, website-browse]
    steps:
      - uses: actions/checkout@v7

      # No `if: secrets... != ''` guard on purpose. The release job's
      # equivalent guard silently skipped the Marketplace publish when VSCE_PAT
      # wasn't set, and the release looked green while half of it hadn't
      # happened. A missing token here fails loudly instead.
      # wranglerVersion stays pinned. wrangler-action@v3 defaulted to 3.90.0,
      # which predates assets-only Workers — with `assets.directory` and no
      # `main` it failed with "Missing entry-point", and the site never once
      # deployed from CI because of it. v4 defaults to a 4.x that works, but
      # an explicit pin is what stops a future default silently reintroducing
      # the same class of breakage.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.site }}
          wranglerVersion: "4.121.0"
